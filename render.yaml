# Render blueprint for the Django API + managed PostgreSQL.
services:
  - type: web
    name: edumind-api
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn edumind.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: edumind-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: edumind-db
    databaseName: edumind
    plan: free
